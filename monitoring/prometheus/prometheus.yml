global:
  scrape_interval: 2s
  evaluation_interval: 2s
  external_labels:
    cluster: 'odyssey-local'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    static_configs:
      - targets: ['gateway:8000']
    metrics_path: '/metrics'

  - job_name: 'data-service'
    static_configs:
      - targets: ['data-service:8001']

  - job_name: 'ml-engine'
    static_configs:
      - targets: ['ml-engine:8002']

  - job_name: 'strategy-engine'
    static_configs:
      - targets: ['strategy-engine:8003']

  - job_name: 'trading-executor'
    static_configs:
      - targets: ['host.docker.internal:8004']
